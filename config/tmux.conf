# Ctrl-Space and Ctrl-b are both accepted as tmux prefixes (`prefix2` needs
# tmux >= 3.1; both hosts run a recent nixpkgs tmux).
#
# `send-prefix` is what makes a doubled prefix reach the application: the plain
# form sends the primary prefix, `-2` sends the secondary one. tmux only
# auto-binds the built-in default prefix (C-b), so both keys are bound here.
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
bind C-b send-prefix -2

set -g mode-keys vi
# HM emits `status-keys emacs` unconditionally. tmux's own default follows
# $EDITOR (nvim on both hosts), so pin the vi binding rather than leaving it to
# the environment.
set -g status-keys vi
# Same for the status-line clock: HM defaults to 12-hour, tmux defaults to 24.
setw -g clock-mode-style 24
set -g set-clipboard on
set -g mouse on
set -g allow-passthrough on
# Pass focus in/out events through to applications (nvim autoread, yazi, ...).
set -g focus-events on
set -as terminal-features ',alacritty:RGB'
set -as terminal-features ',tmux-256color:RGB'
set -g history-limit 100000
set -g extended-keys on
set -g extended-keys-format csi-u
