# The prefix key is per host (programs.tmux.prefix in hosts/; Ctrl-Space on
# direct-terminal hosts, tmux's default Ctrl-b on SSH servers); this file
# holds only prefix-independent settings.
# Exactly one key may act as the prefix. Home Manager's rebind (unbind C-b,
# set -g prefix ...) never touches tmux's secondary prefix `prefix2`, and a
# long-lived server keeps whatever `prefix2` value it was started with, so pin
# it off here: Ctrl-Space and Ctrl-b must never both be prefixes at once.
set -g prefix2 None
set -g mode-keys vi
# HM emits `status-keys emacs` unconditionally. tmux's own default follows
# $EDITOR (nvim on both hosts), so pin the vi binding rather than leaving it to
# the environment.
set -g status-keys vi
# Same for the status-line clock: HM defaults to 12-hour, tmux defaults to 24.
setw -g clock-mode-style 24
set -g set-clipboard on
set -g mouse on
set -g allow-passthrough on
# Pass focus in/out events through to applications (nvim autoread, yazi, ...).
set -g focus-events on
set -as terminal-features ',alacritty:RGB'
set -as terminal-features ',tmux-256color:RGB'
set -g history-limit 100000
set -g extended-keys on
set -g extended-keys-format csi-u
