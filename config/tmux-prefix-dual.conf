# Ctrl-Space and Ctrl-b are both accepted as tmux prefixes (`prefix2` needs
# tmux >= 3.1; both hosts run a recent nixpkgs tmux).
#
# `send-prefix` is what makes a doubled prefix reach the application: the plain
# form sends the primary prefix, `-2` sends the secondary one. tmux only
# auto-binds the built-in default prefix (C-b), so both keys are bound here.
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix
bind C-b send-prefix -2
