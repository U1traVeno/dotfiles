name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Sanity gate, not a build farm. Every host is instantiated for its own
  # platform from a single Linux runner, which catches the mistakes that
  # actually happen when editing from the wrong machine: bad option names,
  # missing or renamed packages, packages unsupported on the target platform
  # and failed module assertions.
  #
  # Deliberately evaluation-only. `nix flake check` would really build the
  # x86_64-linux homes on this runner, which takes many minutes and duplicates
  # what happens anyway on `home-manager switch`. Compile failures are not
  # this workflow's job.
  eval:
    name: evaluate all hosts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Instantiate every host
        run: |
          set -euo pipefail
          hosts="$(nix eval --json '.#homeConfigurations' \
            --apply builtins.attrNames | jq -r '.[]')"

          if [ -z "$hosts" ]; then
            echo "::error::no homeConfigurations found"
            exit 1
          fi

          status=0
          for host in $hosts; do
            echo "::group::$host"
            if drv="$(nix eval --raw \
                ".#homeConfigurations.\"$host\".activationPackage.drvPath")"; then
              echo "$host -> $drv"
            else
              echo "::error::$host failed to evaluate"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
